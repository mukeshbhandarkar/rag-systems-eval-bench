[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-systems-eval-bench"
version = "0.1.0"
description = "A small, reproducible retrieval evaluation framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=3,<6",
    "sentencepiece>=0.2,<0.3",
    "torch>=2.1",
    "transformers>=4.41,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
